# Render Blueprint: New > Blueprint > pick this repository.
# Free plans for the trial. Before relying on it, switch the web service to Starter and the database to Basic:
# the free database is deleted 30 days after it is created (14-day grace), and the free web service sleeps after 15 idle minutes.
services:
  - type: web
    name: wmf-community
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Dubai
      - key: DATABASE_URL
        fromDatabase:
          name: wmf-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: wmf-db
    plan: free
    region: frankfurt
    databaseName: wmf
    user: wmf
    ipAllowList: []
