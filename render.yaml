# Render Blueprint: New > Blueprint > pick this repository.
# The data lives in Neon (free plan, no 30-day expiry). Paste Neon's connection string as DATABASE_URL when Render asks.
# The free web service sleeps after 15 idle minutes; switch it to Starter for instant start-up.
services:
  - type: web
    name: wmf-community
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Dubai
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # optional: switches on the HR CSV feed (Department → HR export). Any long random text; give it only to HR.
      - key: HR_FEED_TOKEN
        sync: false
      # optional: lets the GitHub Action run the race watch on demand (POST /api/race-watch/run). The race watch works without it.
      - key: RACE_WATCH_TOKEN
        sync: false
      # optional: who gets the "new races" email (default: ADMIN_EMAIL). Can also be set on the Race watch page.
      - key: RACE_NOTIFY_EMAIL
        sync: false
