# Render Blueprint: New > Blueprint > pick this repository.
# The data lives in Neon (free plan, no 30-day expiry). Paste Neon's connection string as DATABASE_URL when Render asks.
# The free web service sleeps after 15 idle minutes; switch it to Starter for instant start-up.
services:
  - type: web
    name: wmf-community
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Dubai
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

