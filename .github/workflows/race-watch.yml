# Race watch, every morning at 07:00 Dubai time. Nothing to set up:
#  1. reads the UAE race pages and posts the new cycling/triathlon races on the "Race watch: new UAE races" issue,
#     assigned to the repository owner, so GitHub notifies them by email and in the GitHub app;
#  2. wakes the app on Render, which then adds the new races to the WMF calendar by itself.
# Optional: a repository variable APP_URL if the app's address isn't https://wmf-community.onrender.com.
name: Race watch
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post new races on the Race watch issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RACE_WATCH_ASSIGNEE: ${{ github.repository_owner }}
        run: node scripts/race-watch-notify.js
      - name: Wake the app so it adds them to the calendar
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL || 'https://wmf-community.onrender.com' }}
          RACE_WATCH_TOKEN: ${{ secrets.RACE_WATCH_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "app: HTTP %{http_code}\n" --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${APP_URL%/}/healthz" || true
          # with the optional token, run the check now instead of waiting for the app's own check
          if [ -n "$RACE_WATCH_TOKEN" ]; then curl -sS --max-time 180 -X POST -H "Authorization: Bearer $RACE_WATCH_TOKEN" "${APP_URL%/}/api/race-watch/run"; echo; fi
